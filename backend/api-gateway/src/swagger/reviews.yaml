paths:
  /api/reviews:
    post:
      tags:
        - Reviews
      summary: Create a new review
      description: |
        Create a review for a completed ride.
        Reviewer is identified via x-user-id header (injected by API Gateway).
        Ride must be COMPLETED (validated via internal RideReadModel).
        One review per reviewer per ride (enforced by unique constraint).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rideId
                - targetUserId
                - rating
              properties:
                rideId:
                  type: string
                  description: ID of the completed ride
                targetUserId:
                  type: string
                  description: ID of the user being reviewed (driver or passenger)
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          description: Invalid rating or missing fields
        '403':
          description: Reviewer is not a participant of the ride
        '404':
          description: Ride not found or not yet completed
        '409':
          description: Duplicate review — already reviewed this ride

  /api/reviews/check:
    get:
      tags:
        - Reviews
      summary: Check if current user has reviewed a ride
      description: Uses x-user-id from JWT to check review existence.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: rideId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      exists:
                        type: boolean
                      reviewId:
                        type: string
                        nullable: true
                      rating:
                        type: integer
                        nullable: true

  /api/reviews/ride/{rideId}:
    get:
      tags:
        - Reviews
      summary: Get all reviews for a ride
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: rideId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of reviews for the ride
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'

  /api/reviews/user/{userId}:
    get:
      tags:
        - Reviews
      summary: Get reviews targeting a user (with average rating)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User reviews with average rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      reviews:
                        type: array
                        items:
                          $ref: '#/components/schemas/Review'
                      averageRating:
                        type: number
                        nullable: true
                        example: 4.5
                      totalReviews:
                        type: integer
                        example: 12

components:
  schemas:
    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rideId:
          type: string
        reviewerId:
          type: string
        targetUserId:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ReviewResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Review created
        data:
          $ref: '#/components/schemas/Review'

    ReviewListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Review'
