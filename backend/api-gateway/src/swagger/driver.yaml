# src/swagger/driver.yaml
paths:
  /api/drivers:
    get:
      tags:
        - Drivers
      summary: Get all drivers with filters (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of drivers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Driver'

    post:
      tags:
        - Drivers
      summary: Create new driver profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vehicle_type
                - vehicle_plate
                - current_lat
                - current_lng
              properties:
                vehicle_type:
                  type: string
                  enum: [BIKE, CAR]
                  example: "CAR"
                vehicle_plate:
                  type: string
                  example: "51G-12345"
                current_lat:
                  type: number
                  format: double
                  example: 10.762622
                current_lng:
                  type: number
                  format: double
                  example: 106.660172
      responses:
        '201':
          description: Driver created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '400':
          description: Validation error

  /api/drivers/available:
    get:
      tags:
        - Drivers
      summary: List available drivers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of available drivers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Driver'

  /api/drivers/nearby:
    get:
      tags:
        - Drivers
      summary: Get nearby available drivers sorted by distance
      description: |
        Trả về danh sách tài xế online theo thứ tự `distance_km` tăng dần (gần nhất trước),
        sau đó phụ theo `rating_avg` giảm dần.

        > Lưu ý: Driver chỉ xuất hiện nếu `is_available = true` và vừa cập nhật vị trí gần đây.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
            format: double
          example: 10.7765
        - in: query
          name: lng
          required: true
          schema:
            type: number
            format: double
          example: 106.7009
        - in: query
          name: radius
          required: false
          schema:
            type: number
            default: 10
          description: Bán kính tìm kiếm (km)
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
          description: Số lượng tài xế tối đa
      responses:
        '200':
          description: Nearby drivers sorted by distance asc
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Driver'
                        - type: object
                          properties:
                            distance_km:
                              type: number
                              format: float
                              example: 2.04

  /api/drivers/{id}:
    get:
      tags:
        - Drivers
      summary: Get driver by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Driver details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '404':
          description: Driver not found

    put:
      tags:
        - Drivers
      summary: Update driver information
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_type:
                  type: string
                  enum: [BIKE, CAR]
                vehicle_plate:
                  type: string
      responses:
        '200':
          description: Driver updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'

    delete:
      tags:
        - Drivers
      summary: Delete driver (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Driver deleted successfully

  /api/drivers/{id}/status:
    patch:
      tags:
        - Drivers
      summary: Update driver availability
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_available
              properties:
                is_available:
                  type: boolean
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'

  /api/drivers/{id}/location:
    patch:
      tags:
        - Drivers
      summary: Update driver GPS location
      description: |
        Cập nhật vị trí GPS hiện tại của tài xế. Dùng để:
        - **Test Case 51** – Giả lập 3 tài xế ở vị trí khác nhau để kiểm tra AI chọn tài xế gần nhất.
        - **Realtime tracking** – Driver app gọi định kỳ để cập nhật vị trí.

        > **Lưu ý:** Sau khi cập nhật, `updated_at` sẽ được refresh. Endpoint `/api/drivers/nearby` chỉ trả về driver có `updated_at` trong vòng 1 phút gần đây.

        ### Toạ độ mẫu cho Test Case 51 (Passenger tại: 10.8221, 106.6868)
        | Driver | Khoảng cách | current_lat | current_lng |
        |--------|------------|-------------|-------------|
        | D1 | ~5 km | 10.8672 | 106.6868 |
        | D2 | ~2 km | 10.8401 | 106.6868 |
        | D3 | ~3 km | 10.8491 | 106.6868 |
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Driver UUID (lấy từ GET /api/drivers hoặc GET /api/drivers/profile/me)
          schema:
            type: string
            format: uuid
            example: "dae07fab-930e-46e7-ae1d-826dd07545fb"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_lat
                - current_lng
              properties:
                current_lat:
                  type: number
                  format: double
                  description: Vĩ độ (latitude), từ -90 đến 90
                  example: 10.840129
                current_lng:
                  type: number
                  format: double
                  description: Kinh độ (longitude), từ -180 đến 180
                  example: 106.686780
            examples:
              D2_2km_away:
                summary: "D2 – Cách Passenger 2km (Test Case 51)"
                value:
                  current_lat: 10.840129
                  current_lng: 106.686780
              D1_5km_away:
                summary: "D1 – Cách Passenger 5km (Test Case 51)"
                value:
                  current_lat: 10.867156
                  current_lng: 106.686780
              D3_3km_away:
                summary: "D3 – Cách Passenger 3km (Test Case 51)"
                value:
                  current_lat: 10.849138
                  current_lng: 106.686780
              Passenger_Location:
                summary: "Vị trí Hành Khách"
                value:
                  current_lat: 10.822111
                  current_lng: 106.686780
      responses:
        '200':
          description: Vị trí cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
              example:
                success: true
                message: "Driver location updated"
                data:
                  id: "dae07fab-930e-46e7-ae1d-826dd07545fb"
                  vehicle_plate: "TEST-3227"
                  current_lat: 10.780640
                  current_lng: 106.660172
                  is_available: true
                  updated_at: "2026-05-02T16:20:00.000Z"
        '400':
          description: Thiếu hoặc sai tọa độ
        '401':
          description: Không có JWT hoặc JWT hết hạn
        '403':
          description: Không phải tài xế này hoặc không phải Admin
        '404':
          description: Driver ID không tồn tại

  /api/drivers/profile/me:
    get:
      tags:
        - Drivers
      summary: Lấy thông tin driver profile của tài xế đang đăng nhập
      description: |
        Trả về ID và thông tin đầy đủ của tài xế dựa vào JWT token.

        > **Dùng cho Test Case 51:** Đăng nhập từng tài khoản driver → gọi endpoint này để lấy `driver.id` → dùng ID đó gọi `PATCH /api/drivers/{id}/location` để set tọa độ giả lập.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thông tin driver profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
              example:
                success: true
                data:
                  id: "dae07fab-930e-46e7-ae1d-826dd07545fb"
                  user_id: "abc-123"
                  vehicle_plate: "TEST-3227"
                  vehicle_type: "CAR"
                  current_lat: 10.780640
                  current_lng: 106.660172
                  is_available: true
                  rating_avg: 4.8
        '401':
          description: Chưa đăng nhập
        '404':
          description: Tài khoản driver chưa tạo profile

components:
  schemas:
    DriverResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Driver'

    Driver:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        vehicle_type:
          type: string
          enum: [BIKE, CAR]
        vehicle_plate:
          type: string
        is_available:
          type: boolean
        current_lat:
          type: number
          format: double
        current_lng:
          type: number
          format: double
        rating_avg:
          type: number
          format: float
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
