# src/swagger/pricing.yaml
paths:
  /api/pricing/estimate:
    post:
      tags:
        - Pricing
      summary: Calculate ride price
      description: Tính giá chuyến đi dựa trên khoảng cách, thời gian, loại xe và surge zones
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - distance_km
                - vehicle_type
              properties:
                distance_km:
                  type: number
                  format: float
                  minimum: 0.1
                  example: 5.0
                duration_min:
                  type: integer
                  minimum: 0
                  example: 10
                vehicle_type:
                  type: string
                  example: "ECONOMY"
                demand_index:
                  type: number
                  format: float
                  description: "Explicit demand index for surge override (e.g., 0 for off-peak)"
                  example: 0
                supply_index:
                  type: number
                  format: float
                  description: "Explicit supply index for surge override"
                  example: 1
                zoneId:
                  type: string
                  description: "Zone ID for AI Surge prediction fallback"
                  example: "zone_123"
      responses:
        '200':
          description: Fare estimated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Fare estimate"
                  data:
                    $ref: '#/components/schemas/PriceResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/pricing/rules:
    get:
      tags:
        - Pricing
      summary: Get pricing rules
      description: Lấy các quy tắc tính giá hiện tại
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of pricing rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PricingRule'

components:
  schemas:
    PriceResponse:
      type: object
      properties:
        baseFare:
          type: number
          example: 10000
        distanceFare:
          type: number
          example: 30000
        timeFare:
          type: number
          example: 15000
        surgeMultiplier:
          type: number
          example: 1.0
        surgeVersion:
          type: integer
          example: 1
        surgeSource:
          type: string
          example: "demand_supply_index"
        totalFare:
          type: number
          example: 55000
        currency:
          type: string
          example: "VND"
        breakdown:
          type: object
          properties:
            vehicle_type:
              type: string
              example: "ECONOMY"
            distance_km:
              type: number
              example: 5.0
            duration_min:
              type: number
              example: 10
            base_fare:
              type: number
              example: 10000
            price_per_km:
              type: number
              example: 6000
            price_per_min:
              type: number
              example: 1500
            surgeApplied:
              type: boolean
              example: false
            demand_index:
              type: number
              nullable: true
              example: 0
            supply_index:
              type: number
              nullable: true
              example: 1

    PricingRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vehicleType:
          type: string
          enum: [BIKE, CAR]
        basePrice:
          type: number
          example: 10000
        pricePerKm:
          type: number
          example: 2000
        pricePerMin:
          type: number
          example: 500
        minFare:
          type: number
          example: 15000

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
