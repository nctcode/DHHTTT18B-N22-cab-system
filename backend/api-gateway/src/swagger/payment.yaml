# src/swagger/payment.yaml
paths:
  /api/payments:
    post:
      tags:
        - Payments
      summary: Create payment for ride
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rideId
                - passengerId
                - amount
                - method
              properties:
                rideId:
                  type: string
                  description: MongoDB ObjectId
                passengerId:
                  type: string
                  description: Passenger ID
                amount:
                  type: number
                  format: float
                method:
                  type: string
                  enum: [CASH, MOMO, VNPAY, CREDIT_CARD]
      responses:
        '201':
          description: Payment created successfully
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/payments/{id}:
    get:
      tags:
        - Payments
      summary: Get payment by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment details
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/payments/ride/{rideId}:
    get:
      tags:
        - Payments
      summary: Get payments by ride ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: rideId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment details

  /api/payments/passenger/{passengerId}:
    get:
      tags:
        - Payments
      summary: Get payments by passenger ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: passengerId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment details

  /api/payments/{id}/success:
    patch:
      tags:
        - Payments
      summary: Mark payment as SUCCESS
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment success

  /api/payments/{id}/fail:
    patch:
      tags:
        - Payments
      summary: Mark payment as FAILED
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment failed

  /api/payments/{id}/refund:
    patch:
      tags:
        - Payments
      summary: Mark payment as REFUNDED
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment refunded

components:
  schemas:
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rideId:
          type: string
        passengerId:
          type: string
        amount:
          type: number
        method:
          type: string
          enum: [CASH, MOMO, VNPAY, CREDIT_CARD]
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED, REFUNDED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
