# src/swagger/ride.yaml
paths:
  /api/rides:
    post:
      tags:
        - Rides
      summary: Create ride from booking
      description: >
        Tạo bản ghi ride dựa trên booking. API này thường được gọi trong luồng điều phối
        booking -> ride. Đây cũng là bước chuẩn bị để test rollback khi payment failed.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bookingId
                - passengerId
              properties:
                bookingId:
                  type: string
                  description: Booking ObjectId
                  example: "66492c4864a7e95ecfded111"
                passengerId:
                  type: string
                  description: Passenger user id (UUID)
                  example: "3dfd55db-3743-4356-8992-6274c5a0ba93"
                pickup:
                  $ref: '#/components/schemas/RideLocation'
                dropoff:
                  $ref: '#/components/schemas/RideLocation'
                route:
                  $ref: '#/components/schemas/RideRoute'
                driverId:
                  type: string
                  nullable: true
                  description: Driver user id (optional, for direct assignment)
                driverLocation:
                  $ref: '#/components/schemas/RideLatLng'
                paymentMethod:
                  type: string
                  enum: [CASH, WALLET, CARD]
                  example: CARD
      responses:
        '201':
          description: Ride created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/rides/{id}:
    get:
      tags:
        - Rides
      summary: Get ride by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Ride ObjectId
      responses:
        '200':
          description: Ride details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideApiResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/rides/passenger/{passengerId}:
    get:
      tags:
        - Rides
      summary: Get rides by passenger
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: passengerId
          required: true
          schema:
            type: string
          description: Passenger user id
      responses:
        '200':
          description: List rides of passenger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideApiListResponse'

  /api/rides/driver/{driverId}:
    get:
      tags:
        - Rides
      summary: Get rides by driver
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: driverId
          required: true
          schema:
            type: string
          description: Driver user id
      responses:
        '200':
          description: List rides of driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideApiListResponse'

  /api/rides/{id}/assign:
    patch:
      tags:
        - Rides
      summary: Assign driver to ride
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Ride ObjectId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - driverId
              properties:
                driverId:
                  type: string
                  example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                driverLocation:
                  $ref: '#/components/schemas/RideLatLng'
      responses:
        '200':
          description: Driver assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideApiResponse'

  /api/rides/{id}/arrive:
    patch:
      tags:
        - Rides
      summary: Mark driver arrived at pickup
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ride status changed to ARRIVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideApiResponse'

  /api/rides/{id}/start:
    patch:
      tags:
        - Rides
      summary: Start ride
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ride started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideApiResponse'

  /api/rides/{id}/complete:
    patch:
      tags:
        - Rides
      summary: Complete ride and trigger payment processing
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - actualDistanceKm
                - actualDurationMin
              properties:
                actualDistanceKm:
                  type: number
                  format: float
                  minimum: 0
                  example: 6.7
                actualDurationMin:
                  type: number
                  format: float
                  minimum: 0
                  example: 21
                driverLocation:
                  $ref: '#/components/schemas/RideLatLng'
      responses:
        '200':
          description: Ride completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideApiResponse'

  /api/rides/{id}/confirm-cash-payment:
    patch:
      tags:
        - Rides
      summary: Driver confirms cash payment
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cash payment confirmed (paymentStatus = PAID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideApiResponse'

  /api/rides/{id}/simulate-wallet:
    patch:
      tags:
        - Rides
      summary: Simulate wallet payment for testing
      description: >
        Endpoint phục vụ test. Khi gửi fail_simulation=true, hệ thống publish event
        ride.payment.failed và kích hoạt compensation: booking-service rollback booking
        sang FAILED.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Ride ObjectId
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fail_simulation:
                  type: boolean
                  default: false
                  example: true
      responses:
        '200':
          description: Wallet payment simulated as success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideApiResponse'
        '402':
          description: Simulated payment failure sent to compensation flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideSimulationFailedResponse'

  /api/rides/{id}/cancel:
    patch:
      tags:
        - Rides
      summary: Passenger cancel ride
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ride cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideApiResponse'

  /api/rides/{id}/driver-cancel:
    patch:
      tags:
        - Rides
      summary: Driver cancel accepted ride (trigger rematching)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ride cancelled by driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideApiResponse'

  /api/rides/eta:
    post:
      tags:
        - Rides
      summary: Predict ETA for a route
      description: >
        Dự đoán thời gian đến (ETA) dựa trên mô hình AI. 
        **Test Case Logic**: Với quãng đường đầu vào khoảng 5km, kết quả `predictedArrivalMinutes` và `predictedTripDurationMinutes` 
        phải nằm trong dải giá trị hợp lý (lớn hơn 0 và nhỏ hơn 60 phút) để đảm bảo mô hình không trả về giá trị vô lý.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickup
                - destination
              properties:
                pickup:
                  $ref: '#/components/schemas/RideLatLng'
                destination:
                  $ref: '#/components/schemas/RideLatLng'
                timeOfDay:
                  type: string
                  enum: [MORNING, AFTERNOON, EVENING, NIGHT]
                  example: "MORNING"
                dayOfWeek:
                  type: string
                  enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
                  example: "MONDAY"
            example:
              pickup:
                lat: 10.762622
                lng: 106.660172
              destination:
                lat: 10.762622
                lng: 106.706042
              timeOfDay: "MORNING"
              dayOfWeek: "MONDAY"
      responses:
        '200':
          description: ETA prediction result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: ETA prediction success
                  data:
                    type: object
                    properties:
                      predictedArrivalMinutes:
                        type: number
                        description: Thời gian dự kiến tài xế đến điểm đón (phút). Phải > 0 và < 60 cho quãng đường ~5km.
                        example: 8.5
                      predictedTripDurationMinutes:
                        type: number
                        description: Thời gian dự kiến di chuyển đến điểm đến (phút). Phải > 0 và < 60 cho quãng đường ~5km.
                        example: 15.2
                      distanceKm:
                        type: number
                        description: Quãng đường tính toán (km).
                        example: 5.0
                      source:
                        type: string
                        example: "AI_MODEL_V1"

  /api/rides/route:
    post:
      tags:
        - Rides
      summary: Calculate route between pickup and destination
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickup
                - destination
              properties:
                pickup:
                  $ref: '#/components/schemas/RideLatLng'
                destination:
                  $ref: '#/components/schemas/RideLatLng'
      responses:
        '200':
          description: Route calculated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Route calculated
                  data:
                    $ref: '#/components/schemas/RideRoute'

components:
  schemas:
    RideLatLng:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: double
          example: 10.762622
        lng:
          type: number
          format: double
          example: 106.660172

    RideLocation:
      allOf:
        - $ref: '#/components/schemas/RideLatLng'
        - type: object
          required:
            - address
          properties:
            address:
              type: string
              example: "123 Nguyen Van Linh, District 7, HCMC"

    RideRoute:
      type: object
      properties:
        distanceKm:
          type: number
          example: 7.2
        durationMin:
          type: number
          example: 18
        polyline:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number

    RideData:
      type: object
      properties:
        _id:
          type: string
          example: "66492c4864a7e95ecfded222"
        id:
          type: string
          example: "66492c4864a7e95ecfded222"
        bookingId:
          type: string
          example: "66492c4864a7e95ecfded111"
        passengerId:
          type: string
          example: "3dfd55db-3743-4356-8992-6274c5a0ba93"
        driverId:
          type: string
          nullable: true
          example: null
        status:
          type: string
          enum: [CREATED, ASSIGNED, ARRIVED, STARTED, COMPLETED, CANCELLED, CANCELLED_BY_DRIVER]
          example: COMPLETED
        pickup:
          $ref: '#/components/schemas/RideLocation'
        dropoff:
          $ref: '#/components/schemas/RideLocation'
        previewRoute:
          allOf:
            - $ref: '#/components/schemas/RideRoute'
          nullable: true
        driverToPickupRoute:
          allOf:
            - $ref: '#/components/schemas/RideRoute'
          nullable: true
        tripRoute:
          allOf:
            - $ref: '#/components/schemas/RideRoute'
          nullable: true
        actualDistanceKm:
          type: number
          nullable: true
          example: 6.7
        actualDurationMin:
          type: number
          nullable: true
          example: 21
        finalFare:
          type: number
          nullable: true
          example: 42000
        paymentMethod:
          type: string
          enum: [CASH, CARD, WALLET]
          example: CARD
        paymentStatus:
          type: string
          enum: [UNPAID, PENDING, PAID, FAILED]
          example: FAILED
        assignedAt:
          type: string
          format: date-time
          nullable: true
        arrivedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    RideApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Ride details
        data:
          $ref: '#/components/schemas/RideData'

    RideApiListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Passenger rides
        data:
          type: array
          items:
            $ref: '#/components/schemas/RideData'

    RideSimulationFailedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Wallet payment simulation failed
        data:
          type: object
          properties:
            rideId:
              type: string
              example: "66492c4864a7e95ecfded222"
            bookingId:
              type: string
              example: "66492c4864a7e95ecfded111"
            paymentStatus:
              type: string
              enum: [FAILED]
              example: FAILED

    RideErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Ride not found

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RideErrorResponse'
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RideErrorResponse'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RideErrorResponse'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT